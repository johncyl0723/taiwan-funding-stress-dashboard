name: 更新資料並部署

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch: {}
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # claude CLI（npm install -g @anthropic-ai/claude-code）要求 Node 22+
          node-version: 22
      - run: npm ci
      - run: npm test
      # 選用：用 Claude Code 訂閱（而非計量計費的 API）跑 AI 短評與新聞摘要。
      # `claude setup-token` 產生的 OAuth token，見 README「AI 短評／新聞摘要」。
      - run: npm install -g @anthropic-ai/claude-code
      # 兩組憑證都沒有就整段跳過 AI 文字，其餘資料照常更新；
      # 兩者都設定時優先用 Claude Code 訂閱，見 scripts/lib/commentary.ts
      - run: npm run refresh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_MODEL: ${{ vars.CLAUDE_CODE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '資料更新 [skip ci]'
          file_pattern: 'public/data/*.json'

  build:
    needs: refresh-data
    if: always() && !cancelled() && (needs.refresh-data.result == 'success' || needs.refresh-data.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 未設定就編出純連結版按鈕（連到 Actions 頁面），不是必填
      - run: npm run build
        env:
          VITE_REFRESH_WORKER_URL: ${{ vars.REFRESH_WORKER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: always() && !cancelled() && needs.build.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
